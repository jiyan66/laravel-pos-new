name: Laravel tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
